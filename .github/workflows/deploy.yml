name: Snapshot sheet & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # "Run workflow" button = update now

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Snapshot Google Sheet (Map data tab only)
        id: snap
        if: ${{ env.SA != '' }}
        env:
          SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/snapshot.mjs

      - name: Commit updated data.json
        if: ${{ steps.snap.outcome == 'success' }}
        run: |
          if ! git diff --quiet public/data.json; then
            git config user.name "map-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data.json
            git commit -m "data: snapshot $(date -u +%F\ %H:%M)"
            git push
          fi

      - name: Open issue if the snapshot failed
        if: ${{ failure() && steps.snap.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: 'Map data snapshot failed', body: `See run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. The live map keeps the last good data.` });

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
