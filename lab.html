<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Lab · Ashoka Changemaking Map 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: 'Noto Sans', system-ui, sans-serif; background: #fff; color: #1d2733; }
    .top { padding: 20px 24px 8px; max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; color: #003F72; }
    p { margin: 0 0 12px; font-size: 14px; color: #555; max-width: 760px; }
    .ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
    .ctl button { font: inherit; border: 1px solid #c9c4b6; background: #fff; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
    .ctl button.on { background: #003F72; color: #fff; border-color: #003F72; }
    .page { background: #fff; margin: 12px auto 40px; padding: 28px 0; border-top: 1px solid #E1E4E8; transition: max-width .3s; }
    .page .fake { max-width: 100%; margin: 0 auto; padding: 0 16px; box-sizing: border-box; }
    .fake h2 { font-size: 26px; color: #003F72; margin: 0 0 8px; }
    .fake .lorem { height: 10px; background: #eee; border-radius: 4px; margin: 8px 0; }
    iframe { display: block; width: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Map Lab</h1>
    <p>Prototype for comparing map styles on the live data. Use the width buttons to preview the embed at ashoka.org column widths and on mobile. The embed below uses the exact snippet the client would paste.</p>
    <div class="ctl" id="widths">
      <span>Embed width:</span>
      <button data-w="375">Mobile 375</button>
      <button data-w="768">Tablet 768</button>
      <button data-w="825" class="on">ashoka.org column 825</button>
      <button data-w="1100">Wide 1100</button>
      <span style="margin-left:12px">Language:</span>
      <button data-lang="en" class="on">EN</button>
      <button data-lang="ro">RO</button>
    </div>
  </div>
  <div class="page" id="page" style="max-width:825px">
    <div class="fake"><h2>Romania Changemakers Map 2026</h2><div class="lorem" style="width:90%"></div><div class="lorem" style="width:70%"></div><br /></div>
    <!-- ===== the embed snippet ===== -->
    <iframe id="embed" data-ashoka-map src="./index.html?lab=1&lang=en" title="Changemaking Organization Map 2026" loading="lazy" allow="fullscreen"></iframe>
    <script src="./embed.js" async></script>
    <!-- ============================ -->
    <div class="fake"><br /><div class="lorem" style="width:85%"></div><div class="lorem" style="width:60%"></div></div>
  </div>
  <script>
    var page = document.getElementById('page'), frame = document.getElementById('embed');
    document.querySelectorAll('[data-w]').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('[data-w]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on');
        page.style.maxWidth = b.dataset.w + 'px'; setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 320);
      };
    });
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('[data-lang]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on');
        frame.src = './index.html?lab=1&lang=' + b.dataset.lang;
      };
    });
  </script>
</body>
</html>
